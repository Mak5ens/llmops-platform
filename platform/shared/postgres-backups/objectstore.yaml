# Base backups and WAL of each cluster go under <destinationPath>/<cluster name>.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backups
spec:
  retentionPolicy: 7d
  configuration:
    destinationPath: s3://postgres-backups/
    s3Credentials:
      accessKeyId:
        name: s3-backup
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: s3-backup
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
