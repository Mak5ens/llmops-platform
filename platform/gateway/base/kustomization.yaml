# The shared HTTP entry point of the cluster: one GatewayClass, one Gateway, and the routes of
# the components installed before the Gateway API existed (ArgoCD). Other components bring their own HTTPRoute.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - gatewayclass.yaml
  - gateway.yaml
  - https-redirect.yaml
  - argocd-route.yaml
