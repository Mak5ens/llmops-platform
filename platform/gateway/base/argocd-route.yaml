# Lives here rather than in platform/argocd: ArgoCD is installed first, before the Gateway API CRDs exist.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: platform
      namespace: gateway
      sectionName: https
  hostnames:
    - argocd.localtest.me
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
