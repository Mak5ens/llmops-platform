apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy
    namespace: gateway
---
# How Envoy Gateway deploys the proxies. The Service type is the one setting that depends on the
# cluster (ADR-017): LoadBalancer works on k3d, k3s, Kapsule, and on minikube with `minikube tunnel`.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
  namespace: gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
  # Every request through the Gateway is traced and logged with its trace ID, both over OTLP to the OpenTelemetry
  # Collector (ADR-020): from a point of the gateway's latency graph, its trace, then its logs.
  telemetry:
    tracing:
      # Every request locally; to lower on Kapsule once traffic is real.
      samplingRate: 100
      provider:
        type: OpenTelemetry
        backendRefs:
          - name: otel-collector
            namespace: monitoring
            port: 4317
    accessLog:
      settings:
        # The line Grafana shows: Envoy's default format without the client's address and user agent. Over OTLP,
        # the trace ID travels next to it, as metadata.
        - format:
            type: Text
            text: |
              [%START_TIME%] "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%" %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION% "%REQ(:AUTHORITY)%" "%UPSTREAM_HOST%"
          sinks:
            - type: OpenTelemetry
              openTelemetry:
                backendRefs:
                  - name: otel-collector
                    namespace: monitoring
                    port: 4317
                # The service name of Envoy's spans, so that logs and traces of a request share it.
                resources:
                  service.name: platform.gateway
