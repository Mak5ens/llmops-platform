# Langfuse's settings and secrets, from the store "platform" (ADR-019).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: langfuse-env
  dataFrom:
    # SALT, ENCRYPTION_KEY, NEXTAUTH_SECRET, CLICKHOUSE_PASSWORD, REDIS_PASSWORD
    - extract:
        key: langfuse-internal
    # API keys of the Gateway project, created on first start (LANGFUSE_INIT_*)
    - extract:
        key: langfuse-api-keys
    # The admin account, created on first start
    - extract:
        key: langfuse-accounts
  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef: {key: langfuse-s3, property: ACCESS_KEY_ID}
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef: {key: langfuse-s3, property: ACCESS_SECRET_KEY}
---
# Owner of the langfuse database: CloudNativePG creates it with this password, Langfuse connects with it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: langfuse-db-credentials
    template:
      type: kubernetes.io/basic-auth
  dataFrom:
    - extract:
        key: langfuse-db
---
# Password of the bundled Valkey, in the format of its chart: one key per ACL user.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-redis-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: langfuse-redis-auth
  data:
    - secretKey: default
      remoteRef: {key: langfuse-internal, property: REDIS_PASSWORD}
