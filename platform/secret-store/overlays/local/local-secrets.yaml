apiVersion: v1
kind: Namespace
metadata:
  name: local-secrets
---
# Identity of the store: it can read the Secrets of local-secrets, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
  namespace: local-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: local-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader
  namespace: local-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
  - kind: ServiceAccount
    name: secret-reader
    namespace: local-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  provider:
    kubernetes:
      remoteNamespace: local-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: local-secrets
      auth:
        serviceAccount:
          name: secret-reader
          namespace: local-secrets
