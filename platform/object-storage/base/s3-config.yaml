# The S3 identities of SeaweedFS, rendered from the keys the clients use: one per client, each limited to its bucket.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: seaweedfs-s3-config
    template:
      data:
        s3.json: |
          {
            "identities": [
              {
                "name": "postgres-backups",
                "credentials": [{"accessKey": "{{ .backup_key }}", "secretKey": "{{ .backup_secret }}"}],
                "actions": ["Read:postgres-backups", "Write:postgres-backups", "List:postgres-backups",
                            "Tagging:postgres-backups"]
              },
              {
                "name": "langfuse",
                "credentials": [{"accessKey": "{{ .langfuse_key }}", "secretKey": "{{ .langfuse_secret }}"}],
                "actions": ["Read:langfuse", "Write:langfuse", "List:langfuse", "Tagging:langfuse"]
              }
            ]
          }
  data:
    - secretKey: backup_key
      remoteRef: {key: s3-backup, property: ACCESS_KEY_ID}
    - secretKey: backup_secret
      remoteRef: {key: s3-backup, property: ACCESS_SECRET_KEY}
    - secretKey: langfuse_key
      remoteRef: {key: langfuse-s3, property: ACCESS_KEY_ID}
    - secretKey: langfuse_secret
      remoteRef: {key: langfuse-s3, property: ACCESS_SECRET_KEY}
