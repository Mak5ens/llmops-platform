# SeaweedFS, the S3 store of the local environment: PostgreSQL backups (ADR-018) and Langfuse events and media.
# On Kapsule, Scaleway Object Storage replaces it: this component is not deployed there.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: object-storage
resources:
  - s3-config.yaml
  - seaweedfs.yaml
