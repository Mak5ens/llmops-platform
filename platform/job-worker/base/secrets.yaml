# The gateway keys of the client teams, from the store "platform" (ADR-019): a job runs with its team's key, so the
# team's aliases, budget and guardrail apply.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worker-team-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: worker-team-keys
  dataFrom:
    - extract:
        key: team-keys
