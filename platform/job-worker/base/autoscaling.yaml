# KEDA scales the workers on the jobs of jobs.inference, through RabbitMQ's management API: it counts the jobs waiting
# and those a worker holds, so workers are not scaled down while they still have work (AMQP would only count the
# waiting ones).
#
# - Zero workers while the queue is empty; the first job starts one (activation at 0).
# - Then one worker per 2 jobs, the 2 it runs at a time: no job waits once the workers have caught up. Up to 6: the
#   CI runner has 16 GB for the whole platform.
# - Fewer workers 2 min after fewer jobs, rather than the HPA's 5 min, without the flapping of 30 s.
# - Back to zero 60 s after the queue empties: a burst within the minute finds its workers.
# The figures behind each value: benchmarks/README.md (LAB-136).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq
spec:
  secretTargetRef:
    - parameter: host
      name: rabbitmq-default-user
      key: management_uri
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 0
  maxReplicaCount: 6
  pollingInterval: 5
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
  triggers:
    - type: rabbitmq
      authenticationRef:
        name: rabbitmq
      metadata:
        protocol: http
        queueName: jobs.inference
        mode: QueueLength
        value: "2"
