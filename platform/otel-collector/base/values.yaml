fullnameOverride: otel-collector
mode: daemonset
image:
  # The Kubernetes distribution: the receivers, processors and exporters of this configuration, no more.
  repository: otel/opentelemetry-collector-k8s
presets:
  # filelog receiver on /var/log/pods of the node, added to the logs pipeline.
  logsCollection:
    enabled: true
  # k8sattributes processor: namespace, pod, deployment... on every signal.
  kubernetesAttributes:
    enabled: true
service:
  # A Service in front of the DaemonSet, local to each node (internalTrafficPolicy: Local).
  enabled: true
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {memory: 256Mi}
# The whole configuration, rather than a merge with the chart's defaults (Jaeger and Zipkin receivers, debug exporter).
alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}
  exporters:
    otlphttp/loki:
      endpoint: http://loki.monitoring.svc:3100/otlp
    otlp/tempo:
      endpoint: tempo.monitoring.svc:4317
      tls:
        insecure: true
    otlphttp/prometheus:
      endpoint: http://kps-prometheus.monitoring.svc:9090/api/v1/otlp
  service:
    extensions: [health_check]
    pipelines:
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/loki]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/prometheus]
