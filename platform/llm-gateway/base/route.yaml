# The gateway's API for client teams, on https://llm.localtest.me. Presidio and Ollama have no route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
spec:
  parentRefs:
    - name: platform
      namespace: gateway
      sectionName: https
  hostnames:
    - llm.localtest.me
  rules:
    - backendRefs:
        - name: litellm
          port: 4000
