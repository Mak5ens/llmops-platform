# The gateway's API for client teams, on https://llm.localtest.me. Presidio and Ollama have no route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
spec:
  parentRefs:
    - name: platform
      namespace: gateway
      sectionName: https
  hostnames:
    - llm.localtest.me
  rules:
    # Envoy cuts a request after 15 s by default. A chat-large call that falls back to chat-small takes up to 20 s
    # (its timeout in config/litellm.yaml) plus the answer; LiteLLM caps any call at 60 s (request_timeout).
    - timeouts:
        request: 90s
      backendRefs:
        - name: litellm
          port: 4000
