# The LLM gateway of block 1 (llmops-gateway): LiteLLM from its official chart, Presidio Analyzer and Anonymizer,
# two Ollama servers until vLLM (milestone 3), and the Job that creates the client teams. Images of our own come
# from llmops-gateway on GHCR; the configuration is a copy of its config/ directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-gateway
resources:
  - namespace.yaml
  - postgres.yaml
  - secrets.yaml
  - presidio.yaml
  - ollama.yaml
  - tenants-bootstrap.yaml
  - route.yaml
  - litellm
components:
  - ../../shared/postgres-backups
  - ../../shared/postgres-monitoring
configMapGenerator:
  # Copies of config/litellm.yaml and config/tenants.yaml of llmops-gateway. The service names are the same as in
  # its compose stack (ollama, ollama-large, presidio-analyzer...), so the files are identical.
  - name: litellm-config
    files:
      - config.yaml=config/litellm.yaml
  - name: tenants-config
    files:
      - tenants.yaml=config/tenants.yaml
# Images of an llmops-gateway release, both built from its tag (ADR-023). Renovate updates them in one PR, and
# scripts/gateway-release.sh checks that config/ matches the release.
images:
  - name: ghcr.io/mak5ens/llmops-gateway/litellm
    newTag: 0.2.1
  - name: ghcr.io/mak5ens/llmops-gateway/presidio-analyzer
    newTag: 0.2.1
