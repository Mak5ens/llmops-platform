# LiteLLM from its official chart. A kustomization of its own, included by the parent as a resource, so that the
# parent's generated ConfigMap name (with its content hash) reaches the chart's Deployment, which then restarts
# whenever config.yaml changes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: litellm-helm
    repo: oci://ghcr.io/berriai
    version: 1.104.2
    releaseName: litellm
    valuesFile: values.yaml
    skipTests: true
# The chart sets no namespace, and Kustomize's namespace transformer leaves the resources rendered from a chart
# alone: without one, the reference to the parent's ConfigMap, in llm-gateway, would not be renamed.
patches:
  - target:
      name: litellm
    patch: |
      - op: add
        path: /metadata/namespace
        value: llm-gateway
