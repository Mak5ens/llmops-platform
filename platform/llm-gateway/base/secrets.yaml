# Settings and secrets of the gateway, from the store "platform" (ADR-019), with the variable names of the .env of
# llmops-gateway.

# What LiteLLM needs: its keys, the Langfuse keys its callbacks send traces with, the password of its Redis, and
# the Scaleway key of chat-pro (SCW_SECRET_KEY, empty without one: chat-pro then fails, the other aliases work).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: litellm-env
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: langfuse-api-keys
    - extract:
        key: litellm-redis
    - extract:
        key: scaleway
---
# What the tenant bootstrap needs, which is also what the integration tests of llmops-gateway read
# (GATEWAY_STACK=kubernetes): team keys, Langfuse keys and accounts, Langfuse's database, the Scaleway key (the
# chat-pro tests are skipped without one), and the aliases served by a stand-in model (ollama.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: gateway-env
    template:
      mergePolicy: Merge
      data:
        LANGFUSE_DATABASE_URL: >-
          postgresql://{{ .langfuse_db_user }}:{{ .langfuse_db_password }}@langfuse-db-rw.langfuse.svc:5432/langfuse
        STAND_IN_ALIASES: chat-medium
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: team-keys
    - extract:
        key: langfuse-api-keys
    - extract:
        key: langfuse-accounts
    - extract:
        key: scaleway
  data:
    - secretKey: LANGFUSE_SALT
      remoteRef: {key: langfuse-internal, property: SALT}
    - secretKey: langfuse_db_user
      remoteRef: {key: langfuse-db, property: username}
    - secretKey: langfuse_db_password
      remoteRef: {key: langfuse-db, property: password}
