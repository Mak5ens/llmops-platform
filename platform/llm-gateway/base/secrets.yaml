# Settings and secrets of the gateway, from the store "platform" (ADR-019), with the variable names of the .env of
# llmops-gateway.

# What LiteLLM needs: its keys, and the Langfuse keys its callbacks send traces with.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: litellm-env
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: langfuse-api-keys
---
# What the tenant bootstrap needs, which is also what the integration tests of llmops-gateway read
# (GATEWAY_STACK=kubernetes): team keys, Langfuse keys and accounts, and Langfuse's database.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: gateway-env
    template:
      mergePolicy: Merge
      data:
        LANGFUSE_DATABASE_URL: >-
          postgresql://{{ .langfuse_db_user }}:{{ .langfuse_db_password }}@langfuse-db-rw.langfuse.svc:5432/langfuse
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: team-keys
    - extract:
        key: langfuse-api-keys
    - extract:
        key: langfuse-accounts
  data:
    - secretKey: LANGFUSE_SALT
      remoteRef: {key: langfuse-internal, property: SALT}
    - secretKey: langfuse_db_user
      remoteRef: {key: langfuse-db, property: username}
    - secretKey: langfuse_db_password
      remoteRef: {key: langfuse-db, property: password}
