# LiteLLM's Redis (litellm-redis in the compose stack of llmops-gateway): the spend of the providers with a budget,
# Scaleway's monthly cap (router_settings in config/litellm.yaml). On a volume, with an append-only file, so that a
# restart of LiteLLM or of Redis does not reset what was spent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-redis
spec:
  replicas: 1
  # One volume, mounted by one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7.4.12-alpine
          args: [--requirepass, $(REDIS_PASSWORD), --appendonly, "yes"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-env
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: litellm-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-redis-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-redis
spec:
  selector:
    app.kubernetes.io/name: litellm-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
