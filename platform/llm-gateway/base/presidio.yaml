# Presidio, called by the pii-fr guardrail of LiteLLM on every request of a masked team: the Analyzer finds the
# personal data, the Anonymizer replaces it. Same images, settings and limits as the compose stack.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: presidio-analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: presidio-analyzer
    spec:
      containers:
        - name: analyzer
          # The official image plus the French spaCy model, the French recognizers and their configuration.
          image: ghcr.io/mak5ens/llmops-gateway/presidio-analyzer
          env:
            # Gunicorn 25.1.0 can hang before booting its worker with the control socket on (gunicorn issue #3529).
            - name: GUNICORN_CMD_ARGS
              value: --no-control-socket
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          # Loading the French and English spaCy models takes a while.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 200m
              memory: 1536Mi
            # Measured at 1.6 GiB with both models loaded.
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: presidio-analyzer
spec:
  selector:
    app.kubernetes.io/name: presidio-analyzer
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-anonymizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: presidio-anonymizer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: presidio-anonymizer
    spec:
      containers:
        - name: anonymizer
          image: mcr.microsoft.com/presidio-anonymizer:2.2.362
          env:
            - name: GUNICORN_CMD_ARGS
              value: --no-control-socket
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: presidio-anonymizer
spec:
  selector:
    app.kubernetes.io/name: presidio-anonymizer
  ports:
    - name: http
      port: 3000
      targetPort: http
