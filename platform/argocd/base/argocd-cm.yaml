apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # ArgoCD no longer computes the health of an Application. Without this check, the root
  # application would not wait for one sync wave to be healthy before starting the next.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil and obj.status.health ~= nil then
      hs.status = obj.status.health.status
      if obj.status.health.message ~= nil then
        hs.message = obj.status.health.message
      end
    end
    return hs
