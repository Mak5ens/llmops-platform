# Default user of the RabbitMQ cluster, from the store "platform" (ADR-019), in the format the Cluster Operator
# expects of an external secret: default_user.conf is mounted into RabbitMQ, username and password are read by the
# topology operator. uri is for the clients (workers, KEDA).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-default-user
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: rabbitmq-default-user
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        default_user.conf: |
          default_user = {{ .username }}
          default_pass = {{ .password }}
        uri: "amqp://{{ .username }}:{{ .password }}@rabbitmq.jobs.svc:5672/%2F"
  dataFrom:
    - extract:
        key: rabbitmq
