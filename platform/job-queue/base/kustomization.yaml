# The job queue of milestone 3 (ADR-004): one RabbitMQ node, its credentials from the store "platform", and its
# exchanges, queues and policies declared as resources of the Messaging Topology Operator, so a new cluster gets the
# same topology from Git. Workers consume jobs.inference; KEDA scales them on its length (LAB-135).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jobs
resources:
  - namespace.yaml
  - secrets.yaml
  - rabbitmq.yaml
  - topology.yaml
  - monitoring.yaml
