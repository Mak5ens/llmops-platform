name: Build image

# Reusable workflow (ADR-022): every repo of the platform builds its images with it, so they all go through the same
# gate. Build, scan with Trivy (critical CVEs that have a fix fail the build), then on push: publish to GHCR, generate
# the SBOM with Syft, sign the image and attach the SBOM with cosign, keyless (GitHub's OIDC token, Sigstore), and
# verify both. The certificate names this workflow, so `cosign verify` checks that an image was built here.
#
# Every action is pinned to a commit SHA: in March 2026, 76 tags of aquasecurity/trivy-action were moved to code that
# stole CI secrets (CVE-2026-33634). Trivy is installed from its release, checked against a pinned SHA-256.
#
# Callers grant the permissions: contents: read, packages: write, id-token: write.
on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag, e.g. ghcr.io/mak5ens/llmops-gateway/litellm
        required: true
        type: string
      context:
        description: Build context, relative to the caller's repo
        required: true
        type: string
      build-contexts:
        description: Additional build contexts, one name=path per line
        required: false
        type: string
        default: ""
      version:
        description: Release version, e.g. 1.2.0 (tag v1.2.0). The image gets the tag 1.2.0 next to sha-<commit>
        required: false
        type: string
        default: ""
      push:
        description: Publish, sign and attach the SBOM (false on pull requests)
        required: false
        type: boolean
        default: false
      expect-vulnerable:
        description: Self-test of this workflow only. The scan must fail, and the job succeeds if it does
        required: false
        type: boolean
        default: false
    outputs:
      digest:
        description: Digest of the published image
        value: ${{ jobs.image.outputs.digest }}

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      IMAGE: ${{ inputs.image }}
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      COSIGN_VERSION: v3.1.3
      # The identity of a signature made by this workflow, from any ref of llmops-platform.
      SIGNER: ^https://github.com/Mak5ens/llmops-platform/\.github/workflows/build-image\.yml@
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          # sha-<commit> for every build of main; X.Y.Z for a release, the tag Renovate follows (ADR-023).
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          build-contexts: ${{ inputs.build-contexts }}
          load: true
          tags: scan:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      - name: Install Trivy
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "${TRIVY_SHA256}  $archive" | sha256sum -c
          tar xzf "$archive" trivy
          sudo install -m 755 trivy /usr/local/bin/trivy
      - name: Scan, fail on a critical CVE that has a fix
        id: scan
        continue-on-error: ${{ inputs.expect-vulnerable }}
        run: |
          trivy image --no-progress --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "scan:${{ github.sha }}"
      - name: Self-test, the scan must have failed
        if: inputs.expect-vulnerable
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          [[ $OUTCOME == failure ]] || { echo "The gate let an image with critical CVEs through" >&2; exit 1; }
          echo "The gate blocked the vulnerable image, as expected"

      - if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        id: publish
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          build-contexts: ${{ inputs.build-contexts }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
      - name: SBOM
        if: inputs.push
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.image }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign and attach the SBOM
        if: inputs.push
        env:
          REF: ${{ inputs.image }}@${{ steps.publish.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
      - name: Verify the signature and the SBOM
        if: inputs.push
        env:
          REF: ${{ inputs.image }}@${{ steps.publish.outputs.digest }}
        run: |
          cosign verify --certificate-identity-regexp "$SIGNER" --certificate-oidc-issuer "$ISSUER" "$REF" >/dev/null
          cosign verify-attestation --type spdxjson --certificate-identity-regexp "$SIGNER" \
            --certificate-oidc-issuer "$ISSUER" "$REF" >/dev/null
          echo "Signed and SBOM attached: $REF"
