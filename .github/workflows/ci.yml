name: CI

on:
  pull_request:
    # `edited` re-checks the PR title when it is renamed.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      # gitleaks only scans staged changes as a hook; the job below scans the full history.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-title:
    # PRs are squash-merged, so the PR title becomes the Conventional Commit on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cluster:
    # Creates the local k3d cluster on the runner, bootstraps ArgoCD from the branch under test,
    # then runs the tests, as `just up` and `just test` do on a laptop (ADR-017).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      K3D_VERSION: v5.9.0
      K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Install k3d
        run: |
          curl -fsSLo k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  k3d" | sha256sum -c
          sudo install -m 755 k3d /usr/local/bin/k3d
      - run: just cluster-up
      # ArgoCD deploys from the branch under test, which is already on GitHub.
      # Passed through env, never interpolated into the script: a branch name is user input.
      - run: just bootstrap k3d-llmops local "$REVISION"
        env:
          REVISION: ${{ github.head_ref || github.ref_name }}
      - run: just test
      # The integration tests of block 1, unchanged, against the gateway deployed on the cluster: every alias, the
      # teams' limits and budgets, the fallback, Presidio, the PII guardrail, Langfuse and the leak test.
      - uses: actions/checkout@v7
        with:
          repository: Mak5ens/llmops-gateway
          path: llmops-gateway
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run pytest tests/integration
        working-directory: llmops-gateway
        env:
          GATEWAY_STACK: kubernetes
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --context k3d-llmops get pods -A -o wide
          kubectl --context k3d-llmops get events -A --sort-by=.lastTimestamp
          kubectl --context k3d-llmops -n argocd get applications -o yaml
          kubectl --context k3d-llmops get clusters.postgresql.cnpg.io,backups.postgresql.cnpg.io,externalsecrets -A -o yaml
          kubectl --context k3d-llmops -n llm-gateway logs deployment/litellm --tail=200
          kubectl --context k3d-llmops -n llm-gateway logs job/tenants-bootstrap --tail=100
      - run: just cluster-down
