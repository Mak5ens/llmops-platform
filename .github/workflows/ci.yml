name: CI

on:
  pull_request:
    # `edited` re-checks the PR title when it is renamed.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      # gitleaks only scans staged changes as a hook; the job below scans the full history.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-title:
    # PRs are squash-merged, so the PR title becomes the Conventional Commit on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supply-chain-gate:
    # Self-test of the reusable build workflow (ADR-022): an image with known critical CVEs must be blocked.
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image: ghcr.io/mak5ens/llmops-platform/vulnerable-fixture
      context: .github/fixtures/vulnerable-image
      expect-vulnerable: true

  gateway-release:
    # The llmops-gateway release this branch deploys (ADR-023): its images are signed by build-image.yml with an SBOM
    # attached, and the platform's copy of its configuration matches the release. A Renovate PR is merged only if
    # this job passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: scripts/verify-images.sh
      - run: scripts/gateway-release.sh check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cluster:
    # Creates the local k3d cluster on the runner, bootstraps ArgoCD from the branch under test,
    # then runs the tests, as `just up` and `just test` do on a laptop (ADR-017).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      K3D_VERSION: v5.9.0
      K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0
      - name: Install k3d
        run: |
          curl -fsSLo k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  k3d" | sha256sum -c
          sudo install -m 755 k3d /usr/local/bin/k3d
      - run: just cluster-up
      # ArgoCD deploys from the branch under test, which is already on GitHub.
      # Passed through env, never interpolated into the script: a branch name is user input.
      # Memory of the runner every 30 s while the platform deploys, in the background: where the 16 GB go.
      - run: (while true; do echo "$(date +%T) $(free -m | awk '/Mem:/ {print $3 " MB used, " $7 " MB available"}')"; sleep 30; done) > memory.log 2>&1 &
      - run: just bootstrap k3d-llmops local "$REVISION"
        env:
          REVISION: ${{ github.head_ref || github.ref_name }}
      - run: just test
      # The integration tests of block 1, unchanged, against the gateway deployed on the cluster: every alias, the
      # teams' limits and budgets, the fallback, Presidio, the PII guardrail, Langfuse and the leak test. They are
      # taken from the release the platform deploys, so a new release is tested with its own tests.
      - id: gateway
        run: echo "ref=$(scripts/gateway-release.sh ref)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Mak5ens/llmops-gateway
          ref: ${{ steps.gateway.outputs.ref }}
          path: llmops-gateway
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run pytest tests/integration
        working-directory: llmops-gateway
        env:
          GATEWAY_STACK: kubernetes
      # The whole platform has to fit on the runner (16 GB): print what the cluster takes, success or failure.
      - name: Memory
        if: always()
        run: |
          free -m
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}'
          cat memory.log
      - name: Cluster state on failure
        if: failure()
        # Each command may fail on a cluster that is gone: keep going, to print everything that can be printed.
        run: |
          set +e
          docker ps -a --format '{{.Names}} {{.Status}}'
          sudo dmesg | grep -i -E 'out of memory|oom-kill|killed process' | tail -20
          kubectl --context k3d-llmops get pods -A -o wide
          kubectl --context k3d-llmops get events -A --sort-by=.lastTimestamp | tail -80
          kubectl --context k3d-llmops -n argocd get applications -o yaml
          kubectl --context k3d-llmops get clusters.postgresql.cnpg.io,backups.postgresql.cnpg.io,externalsecrets -A -o yaml
          kubectl --context k3d-llmops -n llm-gateway logs deployment/litellm --tail=200
          kubectl --context k3d-llmops -n llm-gateway logs job/tenants-bootstrap --tail=100
          exit 0
      - run: just cluster-down
