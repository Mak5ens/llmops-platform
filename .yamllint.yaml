extends: default

# Helm templates are not YAML until rendered.
ignore: |
  apps/templates/
  platform/monitoring/base/slo/*.rules.yaml

rules:
  document-start: disable
  line-length:
    max: 120
    level: warning
  truthy:
    # GitHub Actions uses the bare `on:` key.
    allowed-values: ["true", "false", "on"]
  comments:
    min-spaces-from-content: 1
