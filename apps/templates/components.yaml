{{- range .Values.components }}
{{- if or (not .envs) (has $.Values.env .envs) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ .wave | quote }}
  {{- if not .keepResources }}
  # Deleting the Application deletes what it deployed.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- end }}
spec:
  project: default
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.revision }}
    path: platform/{{ .name }}/overlays/{{ $.Values.env }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Some CRDs (ArgoCD's own) are too large for the annotation of a client-side apply.
      - ServerSideApply=true
{{- end }}
{{- end }}
